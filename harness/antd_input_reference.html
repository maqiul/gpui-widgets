<!doctype html>
<html lang="zh">

<title>antdv-next Input 参照页</title>
<script type="importmap">
{
  "imports": {
    "vue": "./vendor/vue.esm-browser.js",
    "antdv-next": "./vendor/antd.esm.js"
  }

<style>
  html, body { margin: 0; background: #fff; }
  #root { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 300px); gap: 12px 24px; }
  .cell { display: flex; flex-direction: column; gap: 4px; }
  .cell .label { font-size: 11px; color: rgba(0,0,0,.45); }
  /* 参照页没有引入 antd reset，补齐其 ul 归零规则，避免浏览器默认 1em 外边距污染 Skeleton 布局 */
  .ant-skeleton-paragraph { margin: 0; padding: 0; }
  /* 同理补齐 reset 的标题上外边距归零（浏览器 UA 给 h1-h5 0.67em 的 margin-top） */
  #panel h1.ant-typography, #panel h2.ant-typography, #panel h3.ant-typography,
  #panel h4.ant-typography, #panel h5.ant-typography { margin-top: 0; }
  /* Modal/Drawer 截图：fixed 浮层改进行内单元格绝对定位，wrap 居中与 Rust 遮罩 flex 居中一致 */
  #panel .ant-modal-mask, #panel .ant-modal-wrap { position: absolute; inset: 0; }
  #panel .ant-modal-wrap { overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #panel .ant-modal { top: 0; margin: 0; padding-bottom: 0; }
  #panel .ant-drawer { position: absolute; inset: 0; }
  /* Spin 动画钉在首帧：rotate 45°、四点 opacity 0.3，与 Rust 静态帧可比 */
  #panel .ant-spin-dot-spin, #panel .ant-spin-dot-item { animation: none; }
  /* Rust 浮层只有预设网格：钉掉 antd 预设折叠头与体内边距 */
  #panel .ant-color-picker-presets .ant-collapse-header { display: none; }
  #panel .ant-color-picker-presets .ant-collapse-body { padding: 0 !important; }
  /* 折叠入场动画在虚拟时间下不收敛：inline height 钉回 auto */
  #panel .ant-color-picker-presets .ant-collapse-content,
  #panel .ant-color-picker-presets .ant-collapse-content-box { height: auto !important; transition: none !important; }
  /* Tour：transform 把 fixed 遮罩/浮层钉进每行盒；无 target 的 center 占位浮层位置钉到盒中心
     （卡片 520×116，盒 528×180）；Rust 侧无箭头 */
  /* DatePicker 浮层入场动画在虚拟时间下不收敛：钉掉 slide motion */
  #panel .ant-picker-dropdown { animation: none !important; transition: none !important; }
  #panel .ant-picker-dropdown .ant-slide-up-enter, #panel .ant-picker-dropdown .ant-slide-up-appear,
  #panel .ant-picker-dropdown .ant-slide-up-enter-active, #panel .ant-picker-dropdown .ant-slide-up-appear-active { animation: none !important; }
  /* TimePicker 列：Rust 不自动滚动到选中项，参照钉 scrollTop=0；滚动条隐藏与 gpui 对齐 */
  #panel .ant-picker-time-panel-column { scrollbar-width: none !important; }
  #panel .ant-picker-time-panel-column::-webkit-scrollbar { display: none; }
  #panel .ant-picker-calendar * { transition: none !important; animation: none !important; }
  /* Popconfirm：钉掉 zoom 入场动画；Rust 侧无箭头 */
  #panel .ant-popconfirm, #panel .ant-popconfirm * { animation: none !important; transition: none !important; }
  #panel .ant-popconfirm .ant-popover-arrow { display: none !important; }
  /* Notification / Message：PurePanel 卡片钉掉入场 motion 与堆栈 scale */
  #panel .ant-notification, #panel .ant-notification *,
  #panel .ant-message, #panel .ant-message * { animation: none !important; transition: none !important; }
  #panel .ant-notification-notice, #panel .ant-message-notice { --notification-scale: 1 !important; transform: none !important; }
  /* InputNumber：步进列展开/箭头高度过渡钉掉，虚拟时间下不收敛 */
  #panel .ant-input-number, #panel .ant-input-number * { transition: none !important; }
  /* 布局族：折叠高度过渡 / 锚点 ink 位移 / 表单提示淡入钉掉，虚拟时间下不收敛 */
  #panel .ant-collapse, #panel .ant-collapse *, #panel .ant-anchor, #panel .ant-anchor *, #panel .ant-form, #panel .ant-form * { transition: none !important; animation: none !important; }
  #panel .ant-collapse-content-active { height: auto !important; }
  /* 选择扩展族：下拉入场 motion / 树展开过渡钉掉，虚拟时间下不收敛 */
  #panel .ant-select-dropdown, #panel .ant-select-dropdown *,
  #panel .ant-cascader-dropdown, #panel .ant-cascader-dropdown *,
  #panel .ant-tree-select-dropdown, #panel .ant-tree-select-dropdown * { transition: none !important; animation: none !important; }
  #panel .ant-cascader-menu { scrollbar-width: none !important; }
  #panel .ant-cascader-menu::-webkit-scrollbar { display: none; }
  /* Rust Tree 无键盘 active 态：钉掉 rc-tree-select 展开时首节点的 active 底（选中节点除外） */
  #panel .ant-select-tree-treenode-active:not(.ant-select-tree-treenode-selected) .ant-select-tree-node-content-wrapper { background: transparent !important; }
  /* 浮钮 / 分割族：独立浮钮钉成行内 absolute；分割条预览过渡钉掉 */
  #panel .ant-float-btn-individual { position: absolute !important; }
  #panel .ant-splitter, #panel .ant-splitter * { transition: none !important; animation: none !important; }
  #panel .ant-layout, #panel .ant-layout * { transition: none !important; animation: none !important; }
  #panel .ant-menu, #panel .ant-menu * { transition: none !important; animation: none !important; }
  #panel .ant-statistic, #panel .ant-statistic * { transition: none !important; animation: none !important; }
  #panel kbd { transition: none !important; animation: none !important; }
  #panel .sb-shot .ant-table, #panel .sb-shot .ant-table * { transition: none !important; animation: none !important; }
  #panel .sb-shot .ant-table-thead { display: none !important; }
  #panel .sb-shot .ant-table-tbody-virtual .ant-table-cell { border-bottom: none !important; }
  #panel .sb-shot .ant-table-tbody-virtual-scrollbar { visibility: visible !important; }
  #panel .tour-box { transform: translateZ(0); }
  #panel .tour-box .ant-tour { left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; }
  #panel .tour-box .ant-tour-arrow { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createApp, h, onMounted, nextTick } from 'vue';
import dayjs from './vendor/dayjs/index.js';
import advancedFormat from './vendor/dayjs/plugin/advancedFormat/index.js';
import customParseFormat from './vendor/dayjs/plugin/customParseFormat/index.js';
import localeData from './vendor/dayjs/plugin/localeData/index.js';
import weekday from './vendor/dayjs/plugin/weekday/index.js';
import weekOfYear from './vendor/dayjs/plugin/weekOfYear/index.js';
import weekYear from './vendor/dayjs/plugin/weekYear/index.js';
dayjs.extend(customParseFormat); dayjs.extend(advancedFormat); dayjs.extend(weekday);
dayjs.extend(localeData); dayjs.extend(weekOfYear); dayjs.extend(weekYear);
import { Alert, Avatar, Badge, Breadcrumb, Button, Card, Carousel, Cascader, Collapse, CollapsePanel, Anchor, ColorPicker, ConfigProvider, DatePicker, TimePicker, Calendar, Checkbox, Descriptions, Divider, Drawer, Dropdown, Empty, FloatButton, Form, FormItem, Input, InputNumber, InputPassword, Layout, LayoutContent, LayoutFooter, LayoutHeader, LayoutSider, Menu, Modal, NotificationPurePanel, MessagePurePanel, MessagePurePanelStyle, Pagination, Space, Popconfirm, Popover, Progress, Radio, Rate, Result, Row, Col, Segmented, Select, Skeleton, Slider, Spin, Splitter, SplitterPanel, Statistic, StatisticTimer, Steps, Switch, Table, Tabs, Tag, TextArea, Timeline, Tour, Transfer, Tree, TreeSelect, Tooltip, Typography, UploadDragger, theme as antTheme } from 'antdv-next';

const VARIANTS = ['outlined', 'filled', 'borderless', 'underlined'];
const STATUSES = ['default', 'error', 'warning'];
const SIZES = ['small', 'middle', 'large'];

// 矩阵：variant × status × size 各一格；disabled 单独一组（换 disabled 伪类的真实属性）
const ROWS = [];
for (const variant of VARIANTS) {
  for (const status of STATUSES) {
    for (const size of SIZES) {
      for (const state of ['normal', 'disabled']) {
        ROWS.push({ variant, status, size, state });
      }
    }
  }
}

const MatrixApp = {
  props: {
    algorithm: { default: 'light' },
    accent: { default: null },
    kind: { default: 'input' },
  },
  setup(props) {
    return () =>
      h(
        ConfigProvider,
        {
          theme: {
            algorithm: props.algorithm === 'dark' ? antTheme.darkAlgorithm : antTheme.defaultAlgorithm,
            token: props.accent ? { colorPrimary: props.accent } : {},
          },
        },
        () =>
          h(
            'div',
            { class: 'grid' },
            ROWS.map(({ variant, status, size, state }) => {
              const Component = props.kind === 'textarea' ? TextArea : Input;
              return h('div', { class: 'cell' }, [
                h('span', { class: 'label' }, `${variant}/${status}/${size}/${state}`),
                h(Component, {
                  variant,
                  status: status === 'default' ? undefined : status,
                  size,
                  disabled: state === 'disabled',
                  placeholder: 'placeholder',
                  style: props.kind === 'textarea' ? { width: '240px' } : undefined,
                  'data-cell': `${variant}|${status}|${size}|${state}`,
                }),
              ]);
            }),
          ),
      );
  },
};

let app = null;
const remount = (component, props) => {
  if (app) {
    app.unmount();
    app = null;
    document.getElementById('root').innerHTML = '';
  }
  app = createApp(component, props);
  app.mount(document.getElementById('root'));
  return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 80))));
};

window.__matrix = (algorithm, accent, kind) =>
  remount(MatrixApp, {
    algorithm: algorithm || 'light',
    accent: accent || null,
    kind: kind || 'input',
  });

// 采集脚本用：把每个格子的内部 input / textarea 元素暴露出来
// （Input / TextArea 都可能把原生控件包进 wrapper）
window.__cells = () =>
  [...document.querySelectorAll('[data-cell]')].map((el) => {
    const input = el.matches('input, textarea') ? el : el.querySelector('input, textarea');
    return { key: el.getAttribute('data-cell'), root: el, input };
  });

// ---- 截图面板：与 Rust 侧 examples/input_panel_shot.rs 同构 ----
// 一个变体一张图，12 行 = 3 种 status × (small / middle / large / disabled)。
// 几何常量必须和 harness/shot_diff.py 一致：pad 16 / 行带 56（控件 40 + 间隙 16）/ label 140 / 行内 gap 8。
const PANEL = { pad: 16, rowH: 40, rowGap: 16, label: 140, gap: 8, width: 420, cell: 240 };
const PANEL_ROWS = [];
for (const status of ['default', 'error', 'warning']) {
  for (const [size, text, extra] of [
    ['small', 'S', {}],
    ['middle', 'M', {}],
    ['large', 'L', {}],
    ['middle', 'off', { disabled: true }],
  ]) {
    PANEL_ROWS.push([`${status}-${text}`, status, size, extra]);
  }
}

// Tag 面板：12 行覆盖 outlined / filled / solid × 默认灰 / 预置蓝 / 状态成功 / 禁用。
const TAG_ROWS = [  ['out-default', {}],
  ['out-blue', { color: 'blue' }],
  ['out-success', { color: 'success' }],
  ['out-error', { color: 'error' }],
  ['out-warning', { color: 'warning' }],
  ['fill-default', { variant: 'filled' }],
  ['fill-blue', { color: 'blue', variant: 'filled' }],
  ['fill-success', { color: 'success', variant: 'filled' }],
  ['solid-default', { variant: 'solid' }],
  ['solid-blue', { color: 'blue', variant: 'solid' }],
  ['off-outlined', { disabled: true }],
  ['off-solid', { color: 'blue', variant: 'solid', disabled: true }],
];

const MENU_ITEMS = [
  { key: 'a', label: '编辑' },
  { key: 'b', label: '复制' },
  { type: 'divider' },
  { key: 'c', label: '删除', danger: true },
  { key: 'd', label: '禁用项', disabled: true },
];

// 零高度触发器把浮层钉在固定坐标，截图只比对浮层覆盖到的行带
const overlayAnchor = (cell, child, top = PANEL.pad + 36) =>
  h(
    'div',
    {
      style: {
        position: 'absolute',
        left: `${PANEL.pad + PANEL.label + PANEL.gap}px`,
        top: `${top}px`,
        width: `${cell}px`,
        height: '0px',
      },
    },
    child,
  );

const menuOverlay = (cell) =>
  overlayAnchor(
    cell,
    h(
      Dropdown,
      { open: true, trigger: ['click'], menu: { items: MENU_ITEMS } },
      () => h('div', { style: { width: `${cell}px`, height: '0px' } }),
    ),
  );

const tooltipOverlay = (cell) =>
  overlayAnchor(
    cell,
    h(
      Tooltip,
      { open: true, placement: 'bottomLeft', title: '工具提示文字' },
      () => h('div', { style: { width: `${cell}px`, height: '0px' } }),
    ),
  );

const popoverOverlay = (cell) =>
  overlayAnchor(
    cell,
    h(
      Popover,
      {
        open: true,
        placement: 'bottomLeft',
        content: h('div', { style: { width: `${cell - 2 * 12}px` } }, '气泡内容'),
      },
      () => h('div', { style: { width: `${cell}px`, height: '0px' } }),
    ),
  );

// 气泡确认框：默认（标题+描述）/ 仅标题（only-child 常规字重）/ okType danger
const POPCONFIRM_LABELS = ['default', 'plain', 'danger'];
const POPCONFIRM_CASES = [
  { title: 'Delete this item?', description: 'This action cannot be undone.' },
  { title: 'Delete this item?' },
  { title: 'Delete this item?', description: 'This action cannot be undone.', okType: 'danger' },
];
const popconfirmOverlay = (cell, row) =>
  overlayAnchor(
    cell,
    h(
      Popconfirm,
      {
        open: true,
        placement: 'bottomLeft',
        okText: 'OK',
        cancelText: 'Cancel',
        getPopupContainer: () => document.getElementById('panel'),
        ...POPCONFIRM_CASES[row],
      },
      () => h('div', { style: { width: `${cell}px`, height: '0px' } }),
    ),
    PANEL.pad + row * 176 + 36,
  );

// Notification / Message：PurePanel 行内渲染卡片（无 portal、无堆栈折叠动画）
const NOTIFICATION_LABELS = ['default', 'plain', 'warning'];
const NOTIFICATION_CASES = [
  {
    type: 'info',
    title: 'Notification Title',
    description: 'This is the content of the notification.',
    actions: h(Button, { type: 'primary', size: 'small' }, () => 'Confirm'),
  },
  { type: 'success', title: 'Success' },
  {
    type: 'warning',
    title: 'Warning Title',
    description: 'This is the content of the notification.',
    closable: false,
  },
];
const MESSAGE_LABELS = ['info', 'success', 'error'];
const MESSAGE_CASES = [
  { type: 'info', content: 'This is a message' },
  { type: 'success', content: 'Success message' },
  { type: 'error', content: 'Error message' },
];

// 输入复合族：InputNumber（handleVisible:true 常显步进列）/ Password / Search(prefix+allowClear)
const NUMBERINPUT_LABELS = ['default', 'filled', 'small', 'large', 'disabled', 'error'];
const NUMBERINPUT_CASES = [
  { value: 3 },
  { value: 3, variant: 'filled' },
  { value: 3, size: 'small' },
  { value: 3, size: 'large' },
  { value: 3, disabled: true },
  { value: 3, status: 'error' },
];
const PASSWORD_LABELS = ['masked', 'visible', 'filled', 'small', 'large', 'disabled'];
const PASSWORD_CASES = [
  { value: 'secret' },
  { value: 'secret' },
  { value: 'secret', variant: 'filled' },
  { value: 'secret', size: 'small' },
  { value: 'secret', size: 'large' },
  { value: 'secret', disabled: true },
];
const SEARCH_PATH = 'M909.6 854.5L649.9 594.8C690.2 542.7 712 479 712 412c0-80.2-31.3-155.4-87.9-212.1-56.6-56.7-132-87.9-212.1-87.9s-155.5 31.3-212.1 87.9C143.2 256.5 112 331.8 112 412c0 80.1 31.3 155.5 87.9 212.1C256.5 680.8 331.8 712 412 712c67 0 130.6-21.8 182.7-62l259.7 259.6a8.2 8.2 0 0011.6 0l43.6-43.5a8.2 8.2 0 000-11.6zM570.4 570.4C528 612.7 471.8 636 412 636s-116-23.3-158.4-65.6C211.3 528 188 471.8 188 412s23.3-116.1 65.6-158.4C296 211.3 352.2 188 412 188s116.1 23.2 158.4 65.6S636 352.2 636 412s-23.3 116.1-65.6 158.4z';
const searchPrefix = () => h('span', {
  class: 'anticon',
  innerHTML: `<svg viewBox="64 64 896 896" fill="currentColor" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg"><path d="${SEARCH_PATH}"></path></svg>`,
});
const SEARCH_LABELS = ['empty', 'text', 'focused', 'small', 'large', 'disabled'];
const SEARCH_CASES = [
  { allowClear: true },
  { value: 'abc', allowClear: true },
  { allowClear: true, autoFocus: true },
  { size: 'small', allowClear: true },
  { size: 'large', allowClear: true },
  { value: 'abc', allowClear: true, disabled: true },
];

// 布局族：Collapse（箭头置右）/ Anchor（连续轨 + ink）/ Form.Item（标签 + 星号 + 提示）
const COLLAPSE_LABELS = ['open', 'closed', 'small', 'large', 'disabled'];
function collapseCase(index, cell) {
  const size = index === 2 ? 'small' : index === 3 ? 'large' : undefined;
  const active = index === 1 ? [] : ['1'];
  const panel = (key, header, disabled) =>
    h(CollapsePanel, { key, header, collapsible: disabled ? 'disabled' : undefined, forceRender: true }, () => 'Content line');
  return h(
    Collapse,
    { activeKey: active, expandIconPlacement: 'end', size, style: { width: `${cell}px` } },
    () => [panel('1', 'Header', index === 4)],
  );
}
const ANCHOR_LABELS = ['active', 'child', 'none', 'leaf'];
const ANCHOR_ITEMS = [
  { key: 'a', href: '#a', title: 'Basic' },
  {
    key: 'b', href: '#b', title: 'API',
    children: [
      { key: 'b1', href: '#b1', title: 'Props' },
      { key: 'b2', href: '#b2', title: 'Events' },
    ],
  },
  { key: 'c', href: '#c', title: 'FAQ' },
];
function anchorCase(index, cell) {
  const active = ['#a', '#b1', '', '#c'][index];
  return h(Anchor, {
    affix: false,
    items: ANCHOR_ITEMS,
    getCurrentAnchor: () => active,
    style: { width: `${cell}px` },
  });
}
const FORM_LABELS = ['default', 'required', 'error', 'extra', 'small'];
function formCase(index, cell) {
  const item = {
    label: 'Name',
    required: index === 1,
    validateStatus: index === 2 ? 'error' : undefined,
    help: index === 2 ? 'Please input name' : undefined,
    extra: index === 3 ? 'Extra help text' : undefined,
  };
  return h(
    Form,
    {
      layout: 'vertical',
      size: index === 4 ? 'small' : undefined,
      style: { width: `${cell}px` },
    },
    () => [h(FormItem, item, () => h(Input, { style: { width: '100%' } }))],
  );
}

// 级联选择：触发框默认宽 controlWidth(184)；浮层列最小宽 111 / 列高 180。
// 文案用 ASCII，避免中英字体宽度差污染文字带比对。
const CASCADER_DATA = [
  { value: 'a', label: 'Alpha', children: [
    { value: 'a1', label: 'Ant', children: [{ value: 'a1x', label: 'Axon' }] },
    { value: 'a2', label: 'Axe', disabled: true },
  ] },
  { value: 'b', label: 'Beta', children: [{ value: 'b1', label: 'Bee' }] },
  { value: 'c', label: 'Gamma' },
];
const CASCADER_LABELS = ['default', 'filled', 'small', 'large', 'disabled', 'error'];
const CASCADER_CASES = [
  { value: ['a', 'a1'] },
  { value: ['a', 'a1'], variant: 'filled' },
  { value: ['a', 'a1'], size: 'small' },
  { value: ['a', 'a1'], size: 'large' },
  { value: ['a', 'a1'], disabled: true },
  { value: ['a', 'a1'], status: 'error' },
];
const CASCADER2_LABELS = ['two', 'three'];
const CASCADER2_CASES = [{ value: ['a'] }, { value: ['a', 'a1'] }];

// 树选择：浮层内边距 8×4，内部树与 kind=tree 同源数据。
const TREESELECT_DATA = [
  { value: 'src', title: 'src', children: [
    { value: 'src-main', title: 'main.rs' },
    { value: 'src-lib', title: 'lib.rs' },
  ] },
  { value: 'readme', title: 'README.md' },
];
const TREESELECT_LABELS = ['default', 'filled', 'small', 'large', 'disabled', 'error'];
const TREESELECT_CASES = [
  { value: 'src-lib' },
  { value: 'src-lib', variant: 'filled' },
  { value: 'src-lib', size: 'small' },
  { value: 'src-lib', size: 'large' },
  { value: 'src-lib', disabled: true },
  { value: 'src-lib', status: 'error' },
];
const TREESELECT2_LABELS = ['selected', 'collapsed'];
const TREESELECT2_CASES = [
  { value: 'src-lib', treeDefaultExpandAll: true },
  {},
];

// 浮钮面板：默认 / 主色 / 方形 / 禁用；独立按钮钉成 absolute 落在各行相对盒内。
const FLOATBUTTON_LABELS = ['default', 'primary', 'square', 'disabled'];
const FLOATBUTTON_CASES = [
  {},
  { type: 'primary' },
  { shape: 'square' },
  { disabled: true },
];
// 分割面板：左右 / 上下，各 50%。
const SPLITTER_LABELS = ['horizontal', 'vertical'];
// 布局容器：默认深navy sider / light sider。
const LAYOUT_LABELS = ['dark', 'light'];
// 栅格：gutter 对半 / 三等分 / offset。
const GRID_LABELS = ['gutter', 'thirds', 'offset'];
// 导航菜单：选中 / 展开子菜单（子选中） / 图标+禁用。每行 3 条目 ×(40+8)=144。
const NAVMENU_LABELS = ['selected', 'submenu', 'states'];
const NAVMENU_ITEMS = [
  [
    { key: 'home', label: '首页' },
    { key: 'docs', label: '文档' },
    { key: 'about', label: '关于' },
  ],
  [
    {
      key: 'settings',

function carouselSlides(item) {
  return Array.from({ length: item.count }, () =>
    h('div', { style: { height: '160px', background: '#364d79' } }));
}

// 穿梭框面板：默认 / 勾选 / 含禁用项；listStyle 宽 170 以放进 420 面板（无标签列）
const TRANSFER_LABELS = ['default', 'checked', 'disabled', '', '', '', '', '', '', '', '', ''];
const TRANSFER_DATA = [
  { key: '1', label: 'content 1' },
  { key: '2', label: 'content 2' },
  { key: '3', label: 'content 3' },
  { key: '4', label: 'content 4' },
];
const TRANSFER_CASES = [
  { targetKeys: ['4'] },
  { targetKeys: ['4'], selectedKeys: ['1', '2'] },
  { targetKeys: ['4'], disabledKey: '2' },
  null,
];
function transferSource(item) {
  return TRANSFER_DATA.map((d) => (d.key === item.disabledKey ? { ...d, disabled: true } : d));
}

function uploadChildren(item) {
  const kids = [
    // innerHTML 走 HTML 解析器，svg 才落在 SVG 命名空间；h('svg') 在 div 下会建成 HTML 未知元素而不渲染
    h('p', {
      class: 'ant-upload-drag-icon',
      innerHTML: `<svg class="anticon" viewBox="0 0 1024 1024" fill="currentColor" style="width:48px;height:48px" xmlns="http://www.w3.org/2000/svg"><path d="${INBOX_PATH}"></path></svg>`,
    }),
    h('p', { class: 'ant-upload-text' }, () => 'Click to upload'),
  ];
  if (item.hint) kids.push(h('p', { class: 'ant-upload-hint' }, () => item.hint));
  return kids;
}

                const item = TYPOGRAPHY_CASES[index];
                if (!item) {
                  content = h('div', { style: { width: `${cell}px`, height: '0px' } });
                } else if (item.kind === 'title') {
                  const { kind, children, ...rest } = item;
                  content = h(Typography.Title, rest, () => children);
                } else {
                  const { kind, children, ...rest } = item;
                  content = h(Typography.Text, rest, () => children);
                }
              } else if (isCard) {
                const item = CARD_CASES[index];
                content = item
                  ? cardContent(item)
                  : h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isAlert) {
                const item = ALERT_CASES[index];
                content = item
                  ? h(Alert, { ...item, style: { width: `${cell}px` } })
                  : h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isSkeleton) {
                const item = SKELETON_CASES[index];
                if (!item) {
                  content = h('div', { style: { width: `${cell}px`, height: '0px' } });
                } else if (item.type === 'avatar') {
                  content = h(Skeleton, {
                    avatar: { size: item.size },
                    title: false,
                    paragraph: false,
                    style: { width: `${cell}px` },
                  });
                } else if (item.type === 'button') {
                  content = h(Skeleton.Button, { active: false });
                } else if (item.type === 'input') {
                  content = h(Skeleton.Input, { active: false });
                } else {
                  content = h(Skeleton, {
                    title: false,
                    paragraph: { rows: item.rows, width: item.width },
                    style: { width: `${cell}px` },
                  });
                }
              } else if (isBreadcrumb) {
                const item = BREADCRUMB_CASES[index];
                content = item
                  ? h(Breadcrumb, item)
                  : h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isBadge) {
                const item = BADGE_CASES[index];
                content = item
                  ? h(Badge, item, () => h(Avatar, { size: 'small' }, () => 'A'))
                  : h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isAvatar) {
                const item = AVATAR_CASES[index];
                content = item
                  ? h(Avatar, item, () => 'A')
                  : h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isProgress) {
                const item = PROGRESS_CASES[index];
                content = item
                  ? h(Progress, {
                      ...item,
                      style: item.steps ? undefined : { width: `${cell}px` },
                    })
                  : h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isPagination) {
                const current = PAGINATION_CASES[index];
                content = current
                  ? h(Pagination, {
                      current: current.current,
                      total: current.total,
                      size: current.size,
                      showSizeChanger: false,
                    })
                  : h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isNotification) {
                content = h(NotificationPurePanel, NOTIFICATION_CASES[index]);
              } else if (isMessage) {
                // 上游 Message PurePanel 漏渲染 PurePanelStyle，且 pure-panel 类与 notice 同元素
                // 导致后代选择器失配：补挂子样式组件并外套一层 pure-panel 钩子 div
                content = [
                  h(MessagePurePanelStyle, { prefixCls: 'ant-message' }),
                  h(
                    'div',
                    { class: 'ant-message-notice-pure-panel' },
                    h(MessagePurePanel, MESSAGE_CASES[index]),
                  ),
                ];
              } else if (isNumberInput) {
                content = h(InputNumber, NUMBERINPUT_CASES[index]);
              } else if (isPassword) {
                content = h(InputPassword, PASSWORD_CASES[index]);
              } else if (isSearch) {
                content = h(Input, { ...SEARCH_CASES[index], prefix: searchPrefix() });
              } else if (isCollapse) {
                content = collapseCase(index, cell);
              } else if (isAnchor) {
                content = anchorCase(index, cell);
              } else if (isForm) {
                content = formCase(index, cell);
              } else if (isNavMenu) {
                content = h(Menu, {
                  mode: 'inline',
                  style: { width: `${cell}px` },
                  items: NAVMENU_ITEMS[index],
                  ...NAVMENU_PROPS[index],
                });
              } else if (isCountdown) {
                content = h(StatisticTimer, {
                  type: 'countdown',
                  value: Date.now() + COUNTDOWN_OFFSETS[index] * 1000,
                  format: COUNTDOWN_FORMATS[index],
                  ...(index === 0 ? { title: '距结束' } : {}),
                });
              } else if (isKbd) {
                const parts = [];
                KBD_KEYS[index].forEach((key, i) => {
                  if (i) parts.push(h('span', {}, '+'));
                  parts.push(h(Typography.Text, { keyboard: true }, () => key));
                });
                content = h('div', { style: { display: 'flex', alignItems: 'center' } }, parts);
              } else if (isScrollbar) {
                content = h('div', { class: 'sb-shot', style: { width: `${cell}px` } }, [
                  h(Table, {
                    virtual: true,
                    columns: [{ title: 'Name', dataIndex: 'name', key: 'name', width: cell - 8 }],
                    dataSource: Array.from({ length: 30 }, (_, i) => ({ key: i, name: `row ${i}` })),
                    scroll: { x: cell - 8, y: 120 },
                    pagination: false,
                  }),
                ]);
              } else if (isLayout) {
                content = h(
                  Layout,
                  { style: { width: `${cell}px`, height: '200px' } },
                  () => [
                    h(LayoutHeader, {}, () => 'Header'),
                    h(Layout, { hasSider: true }, () => [
                      h(
                        LayoutSider,
                        { width: 80, ...(index === 1 ? { theme: 'light' } : {}) },
                        () => 'Sider',
                      ),
                      h(LayoutContent, {}, () => 'Content'),
                    ]),
                    h(LayoutFooter, {}, () => 'Footer'),
                  ],
                );
              } else if (isGrid) {
                const gridCell = (text) =>
                  h(
                    'div',
                    {
                      style: {
                        background: '#1677ff',
                        color: '#fff',
                        height: '40px',
                        lineHeight: '40px',
                        textAlign: 'center',
                      },
                    },
                    text,
                  );
                const gridRow =
                  index === 0
                    ? h(Row, { gutter: 16 }, () => [
                        h(Col, { span: 12 }, () => gridCell('12')),
                        h(Col, { span: 12 }, () => gridCell('12')),
                      ])
                    : index === 1
                      ? h(Row, { gutter: 16 }, () => [
                          h(Col, { span: 8 }, () => gridCell('8')),
                          h(Col, { span: 8 }, () => gridCell('8')),
                          h(Col, { span: 8 }, () => gridCell('8')),
                        ])
                      : h(Row, {}, () => [
                          h(Col, { span: 12, offset: 6 }, () => gridCell('12 offset 6')),
                        ]);
                content = h('div', { style: { width: `${cell}px` } }, [gridRow]);
              } else if (isFloatButton) {
                content = h(
                  'div',
                  { style: { position: 'relative', width: `${cell}px`, height: '96px' } },
                  [h(FloatButton, { icon: () => '↑', ...FLOATBUTTON_CASES[index] })],
                );
              } else if (isSplitter) {
                content = h(
                  Splitter,
                  { vertical: index === 1, style: { width: `${cell}px`, height: '120px' } },
                  () => [
                    h(SplitterPanel, { defaultSize: '50%' }, () =>
                      h('div', { style: { padding: '8px' } }, 'First'),
                    ),
                    h(SplitterPanel, { defaultSize: '50%' }, () =>
                      h('div', { style: { padding: '8px' } }, 'Second'),
                    ),
                  ],
                );
              } else if (isCascader) {
                content = h(Cascader, { options: CASCADER_DATA, ...CASCADER_CASES[index] });
              } else if (isCascader2) {
                content = h(Cascader, {
                  options: CASCADER_DATA,
                  open: true,
                  autoAdjustOverflow: false,
                  getPopupContainer: () => document.getElementById('panel'),
                  ...CASCADER2_CASES[index],
                });
              } else if (isTreeSelect) {
                content = h(TreeSelect, {
                  treeData: TREESELECT_DATA,
                  placeholder: 'Please select',
                  style: { width: `${cell}px` },
                  ...TREESELECT_CASES[index],
                });
              } else if (isTreeSelect2) {
                content = h(TreeSelect, {
                  treeData: TREESELECT_DATA,
                  placeholder: 'Please select',
                  open: true,
                  autoAdjustOverflow: false,
                  getPopupContainer: () => document.getElementById('panel'),
                  style: { width: `${cell}px` },
                  ...TREESELECT2_CASES[index],
                });
              } else if (isOverlay) {
                content = h('div', { style: { width: `${cell}px`, height: '0px' } });
              } else if (isTag) {
                content = h(
                  Tag,
                  { variant: 'outlined', ...row[1], style: { width: `${cell}px` } },
                  () => 'Tag',
                );
              } else {
                const [, status, size, extra] = row;
                if (props.kind === 'multi') {
                  content = h(Select, {
                    mode: 'multiple',
                    variant: props.variant,
                    status: status === 'default' ? undefined : status,
                    size,
                    open: false,
                    value: ['a', 'b'],
                    options: [
                      { value: 'a', label: '选项一' },
                      { value: 'b', label: '选项二' },
                    ],
                    style: { width: `${cell}px` },
                    ...extra,
                  });
                } else if (props.kind === 'select') {
                  content = h(Select, {
                    variant: props.variant,
                    status: status === 'default' ? undefined : status,
                    size,
                    open: false,
                    value: 'v',
                    options: [{ value: 'v', label: '选中项' }],
                    style: { width: `${cell}px` },
                    ...extra,
                  });
                } else {
                  content = h(props.kind === 'textarea' ? TextArea : Input, {
                    variant: props.variant,
                    status: status === 'default' ? undefined : status,
                    size,
                    placeholder: '',
                    style: {
                      width: `${cell}px`,
                      ...(props.kind === 'textarea' ? { height: `${PANEL.rowH}px` } : {}),
                    },
                    ...extra,
                  });
                }
              }
              return h(
                'div',
                {
                  style: {
                    height: `${isScrollbar ? 120 : isNavMenu ? 144 : isCountdown ? 72 : isLayout ? 200 : isFloatButton ? 96 : isSplitter ? 120 : isCascader2 ? 240 : isTreeSelect2 ? 180 : isCollapse ? 140 : isAnchor ? 150 : isForm ? 100 : isSteps || isTimeline ? 120 : isCard ? 200 : isTabs ? 64 : isSlider ? 64 : isSpin ? 64 : isEmpty || isEmpty2 || isColorPicker2 ? 180 : isDatePicker2 ? 396 : isRangePicker2 ? 396 : isCalendar ? 790 : isCalendar2 ? 536 : isPopconfirm ? 160 : isNotification ? 160 : isTimePicker2 ? 320 : isTour ? 180 : isStatistic ? 96 : isTypography ? 72 : isDescriptions ? 216 : isDivider ? 60 : isSpace ? 120 : isResult ? 240 : isTree ? 120 : isTable ? 232 : isUpload ? 160 : isTransfer || isModal || isDrawer ? 200 : isCarousel ? 160 : PANEL.rowH}px`,
                    display: 'flex',
                    alignItems: 'flex-start',
                    gap: `${isTransfer || isModal || isDrawer || isTour || isCalendar || isCalendar2 || isNotification ? 0 : PANEL.gap}px`,
                  },
                },
                [
                  h(
                    'span',
                    { class: 'panel-label', style: { width: `${isTransfer || isModal || isDrawer || isTour || isCalendar || isCalendar2 || isNotification ? 0 : PANEL.label}px`, flex: 'none', fontSize: '12px' } },
                    isTransfer || isModal || isDrawer || isTour || isCalendar || isCalendar2 || isNotification ? '' : label,
                  ),
                  content,
                ],
              );
            }),
              ...(isMenu ? [menuOverlay(cell)] : []),
              ...(isTooltip ? [tooltipOverlay(cell)] : []),
              ...(isPopover ? [popoverOverlay(cell)] : []),
              ...(isPopconfirm ? POPCONFIRM_LABELS.map((_, i) => popconfirmOverlay(cell, i)) : []),
            ],
          ),
      );
    };
  },
};

/// 面板底色与标签色取当前主题的别名令牌，避免把 #fff / #141414 写死在参照页里
const applyPanelTokens = () => {
  const el = document.querySelector(
    '#panel .ant-input, #panel .ant-menu, #panel .ant-cascader, #panel .ant-tree-select, #panel .ant-float-btn, #panel .ant-splitter, #panel .ant-tag, #panel .ant-select, #panel .ant-switch, #panel .ant-checkbox-wrapper, #panel .ant-radio-wrapper, #panel .ant-progress, #panel .ant-avatar, #panel .ant-badge, #panel .ant-breadcrumb, #panel .ant-skeleton, #panel .ant-alert, #panel .ant-card, #panel .ant-steps, #panel .ant-timeline, #panel .ant-segmented, #panel .ant-tabs, #panel .ant-slider, #panel .ant-typography-link, #panel .ant-typography, #panel .ant-statistic, #panel .sb-shot .ant-table-wrapper, #panel .ant-descriptions, #panel .ant-divider, #panel .ant-space, #panel .ant-result, #panel .ant-tree, #panel .ant-table-wrapper, #panel .ant-upload-wrapper, #panel .ant-transfer, #panel .ant-carousel, #panel .ant-modal, #panel .ant-drawer, #panel .ant-color-picker, #panel .ant-tour, #panel .ant-picker, #panel .ant-picker-dropdown, #panel .ant-picker-time-panel-column, .ant-dropdown-menu, .ant-tooltip-container, .ant-popover-container, .ant-pagination, .ant-notification-notice-pure-panel, .ant-message-notice-pure-panel',
  );
  if (new URLSearchParams(location.search).get('kind') === 'timepicker2') {
    document.querySelectorAll('#panel .ant-picker-time-panel-column').forEach((c) => { c.scrollTop = 0; });
  }
  const cs = getComputedStyle(el || document.body);
  const read = (name) => cs.getPropertyValue(`--ant-${name}`).trim();
  const panel = document.getElementById('panel');
  panel.style.background = read('color-bg-container');
  document.querySelectorAll('#panel .panel-label').forEach((node) => {
    node.style.color = read('color-text-tertiary');
  });
  document.body.style.background = panel.style.background;
  return new Promise((r) => requestAnimationFrame(() => setTimeout(r, 60)));
};

window.__panel = (variant, algorithm, accent, kind) =>
  remount(PanelApp, { variant, algorithm, accent, kind: kind || 'input' }).then(applyPanelTokens);

// 无头浏览器截图入口：?panel=outlined&appearance=light&accent=8b5cf6&kind=textarea
// 无参数时保持原来的矩阵模式，供 computed style 采集脚本使用。
const query = new URLSearchParams(location.search);
const queryAccent = query.get('accent');
const queryKind = query.get('kind') || 'input';
window.__ready = query.get('panel')
  ? window.__panel(
      query.get('panel'),
      query.get('appearance') || 'light',
      queryAccent ? `#${queryAccent}` : null,
      queryKind,
    )
  : window.__matrix(
      query.get('appearance') || 'light',
      queryAccent ? `#${queryAccent}` : null,
      queryKind,
    );
</script>
</body>
